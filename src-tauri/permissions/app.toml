[[permission]]
identifier = "allow-get-app-info"
description = "Allows reading the application name and version."
commands.allow = ["get_app_info"]

[[permission]]
identifier = "allow-load-app-data"
description = "Allows loading persisted tasks and settings from the app data directory."
commands.allow = ["load_app_data"]

[[permission]]
identifier = "allow-save-app-data"
description = "Allows saving persisted tasks and settings to the app data directory."
commands.allow = ["save_app_data"]

[[permission]]
identifier = "allow-minimize-to-tray"
description = "Allows hiding the main window to the system tray."
commands.allow = ["minimize_to_tray"]

[[permission]]
identifier = "allow-notify-overtime"
description = "Allows showing a native overtime notification (deduped on the Rust side)."
commands.allow = ["notify_overtime"]

[[permission]]
identifier = "allow-export-json"
description = "Allows opening the native Save dialog and writing the exported JSON to the chosen path."
commands.allow = ["export_json"]

[[permission]]
identifier = "allow-import-json"
description = "Allows opening the native Open dialog and reading a JSON file chosen by the user."
commands.allow = ["import_json"]
